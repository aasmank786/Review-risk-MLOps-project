services:
  api:
    build: .
    ports:
      - "8000:8000"
  ui:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -c "pip install streamlit requests && streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api